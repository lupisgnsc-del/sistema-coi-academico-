{% extends "base.html" %}{% block title %}Cambiar contraseña{% endblock %}
{% block content %}<div class="card auth"><h1>Cambiar contraseña</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Contraseña actual</label><input name="actual" type="password" required style="width:100%" autocomplete="current-password">
<label>Nueva contraseña</label><input name="nueva" type="password" required minlength="10" style="width:100%" autocomplete="new-password">
<p><button>Guardar</button></p></form></div>{% endblock %}
