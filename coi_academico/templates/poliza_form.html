{% extends "base.html" %}{% block title %}Nueva póliza{% endblock %}
{% block content %}<h1>Nueva póliza</h1>
<form method="post" class="card"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="row"><div><label>Tipo</label><select name="tipo"><option>Ingresos</option><option>Egresos</option><option selected>Diario</option></select></div>
<div><label>Fecha</label><input type="date" name="fecha" value="{{ hoy }}" required></div>
<div style="flex:1"><label>Concepto</label><input name="concepto" required maxlength="200" style="width:100%"></div></div>
<div class="scroll"><table id="movs" style="margin-top:1rem"><thead><tr><th>Cuenta</th><th>Concepto del movimiento</th><th class="n">Debe</th><th class="n">Haber</th><th></th></tr></thead><tbody></tbody>
<tfoot><tr class="tot"><td colspan="2" id="dif"></td><td class="n" id="td">0.00</td><td class="n" id="th">0.00</td><td></td></tr></tfoot></table></div>
<p><button type="button" class="sec" id="agregar">+ Agregar movimiento</button> <button>Guardar póliza</button></p></form>
<template id="fila"><tr>
<td><select name="cuenta_id"><option value="">— cuenta —</option>{% for c in cuentas %}<option value="{{ c.id }}">{{ c.codigo }} {{ c.nombre }}</option>{% endfor %}</select></td>
<td><input name="mov_concepto" maxlength="150"></td>
<td class="n"><input name="debe" type="number" step="0.01" min="0" style="width:110px;text-align:right"></td>
<td class="n"><input name="haber" type="number" step="0.01" min="0" style="width:110px;text-align:right"></td>
<td><button type="button" class="del quitar">×</button></td></tr></template>{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='poliza.js') }}"></script>{% endblock %}
