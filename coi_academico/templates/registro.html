{% extends "base.html" %}{% block title %}Registro{% endblock %}
{% block content %}<div class="card auth"><h1>Crear cuenta</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
{% if pide_codigo %}<label>Código de registro (te lo da tu profesora)</label><input name="codigo" required style="width:100%" autocomplete="off">{% endif %}
<label>Usuario (3-30 caracteres)</label><input name="usuario" required style="width:100%" autocomplete="username">
<label>Correo electrónico</label><input name="email" type="email" required style="width:100%">
<label>Contraseña (mín. 10, con mayúsculas, minúsculas y números)</label><input name="password" type="password" required minlength="10" style="width:100%" autocomplete="new-password">
<label>Repite la contraseña</label><input name="password2" type="password" required minlength="10" style="width:100%" autocomplete="new-password">
<p><button>Registrarme</button> <a class="btn sec" href="{{ url_for('login') }}">Ya tengo cuenta</a></p></form></div>{% endblock %}
